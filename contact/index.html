<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Contact — Zee Pauli</title>
    <meta name="description" content="Contact Zee Pauli — start a branding, packaging, or experience design project.">
    <link rel="icon" href="/public/logos/clients/placeholder.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/src/styles/main.css?v=1.0.0">
    <link rel="stylesheet" href="/src/styles/desktop.css?v=1.0.0" media="(min-width: 769px)">
    <link rel="stylesheet" href="/src/styles/mobile.css?v=1.0.0" media="(max-width: 768px)">
    <link rel="stylesheet" href="/src/styles/portfolio.css?v=1.0.0">
    <script type="importmap">
        {
            "imports": {
                "lenis": "/public/vendor/lenis.mjs"
            }
        }
    </script>
</head>
<body class="portfolio-page contact-page">
    <nav class="nav-side">
        <div class="nav-brand">
            <a href="/" class="logo-link">
                <div class="logo-vert">Zee Pauli</div>
            </a>
        </div>
        <div class="nav-social">
            <a class="nav-social__link" href="https://www.linkedin.com/in/zeepauli" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-4 0v7h-4v-13h4v2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    <rect x="2" y="9" width="4" height="12" stroke="currentColor" stroke-width="1.5"/>
                    <circle cx="4" cy="4" r="2" stroke="currentColor" stroke-width="1.5"/>
                </svg>
            </a>
            <a class="nav-social__link" href="https://www.instagram.com/zeepauli" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <rect x="2" y="2" width="20" height="20" rx="5" stroke="currentColor" stroke-width="1.5"/>
                    <circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.5"/>
                    <circle cx="17.5" cy="6.5" r="1" fill="currentColor"/>
                </svg>
            </a>
            <a class="nav-social__link" href="mailto:hello@zee-studio.com" aria-label="Email">
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <rect x="2" y="4" width="20" height="16" rx="2" stroke="currentColor" stroke-width="1.5"/>
                    <path d="M2 7l10 7 10-7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </a>
        </div>
    </nav>

    <div id="smooth-wrapper">
        <div id="smooth-content">
            <section class="portfolio-intro">
                <p class="portfolio-intro__title">Contact</p>
                <p class="portfolio-intro__body">Get in touch to discuss your next design project. Submitting the form opens your email client to hello@zee-studio.com.</p>
            </section>

            <section class="about-content">
                <form class="contact-form" novalidate>
                    <div class="contact-form__field">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" required autocomplete="name">
                    </div>
                    <div class="contact-form__field">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required autocomplete="email">
                    </div>
                    <div class="contact-form__field">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" rows="6" required></textarea>
                    </div>
                    <button type="submit" class="contact-form__submit">Open email to send</button>
                </form>
            </section>
        </div>
    </div>

    <script type="module" src="/src/pages/contact.js"></script>
</body>
</html>
